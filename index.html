<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base de Connaissance Médicale</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vis/4.21.0/vis.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vis/4.21.0/vis.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/vis/4.21.0/vis-network.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/vis/4.21.0/vis-network.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f4f7fa;
        }
        .container {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            padding: 30px;
        }
        h1 {
            color: #2c3e50;
            text-align: center;
        }
        h2 {
            color: #3498db;
            margin-bottom: 20px;
        }
        .form-label {
            font-weight: bold;
        }
        .form-control, .btn {
            border-radius: 5px;
        }
        #resultsTable th {
            background-color: #3498db;
            color: white;
        }
        .btn-primary {
            background-color: #3498db;
            border-color: #3498db;
            font-weight: bold;
        }
        .btn-primary:hover {
            background-color: #2980b9;
            border-color: #2980b9;
        }
        #graphContainer {
            border-radius: 10px;
            margin-top: 20px;
        }
        .table-container {
            margin-top: 20px;
        }
    </style>
</head>
<body class="p-4">
    <div class="container">
        <h1 class="mb-4">Base de Connaissance Médicale</h1>
        
        <form id="queryForm">
            <div class="mb-3">
                <label for="queryInput" class="form-label">Requête SPARQL</label>
                <textarea id="queryInput" class="form-control" rows="5" placeholder="Entrez votre requête SPARQL ici..."></textarea>
            </div>
            <button type="submit" class="btn btn-primary w-100">Exécuter</button>
        </form>
        
        <div class="table-container mt-4">
            <h2>Résultats</h2>
            <table class="table table-bordered" id="resultsTable">
                <thead>
                    <tr id="tableHeader"></tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>

        <div id="graphContainer" style="width: 100%; height: 500px;"></div>
    </div>

    <script src="https://unpkg.com/sparqljs/dist/sparql.js"></script>
    <script src="./app.js"></script>
</body>
</html>
